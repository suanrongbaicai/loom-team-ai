<g transform="translate(460,292)"><rect class="box" width="168" height="88" rx="12"/><text x="18" y="35" class="title">发送前复核</text><text x="18" y="61" class="sub">当前权限与记录版本</text></g>
<g transform="translate(248,292)"><rect class="box" width="168" height="88" rx="12"/><text x="18" y="35" class="title">实际发送</text><text x="18" y="61" class="sub">平台 / MockTransport</text></g>
<g transform="translate(36,292)"><rect class="box" width="168" height="88" rx="12"/><text x="18" y="35" class="title">核对回执</text><text x="18" y="61" class="sub">sent / failed / unknown</text></g>
