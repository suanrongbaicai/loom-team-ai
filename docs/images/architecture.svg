<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">Loom 工作与记录架构</title><desc id="desc">获准输入经过可信身份和任务调度到模型，再调用受控工具；三层记录保存依据，已保存回复经过权限核对后发送，回执写回记录。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526179"/></marker>
<style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#182537} .box{fill:#fff;stroke:#ccd6e3;stroke-width:1.5} .title{font-size:18px;font-weight:600} .sub{font-size:14px;fill:#536479} .line{fill:none;stroke:#526179;stroke-width:2;marker-end:url(#arrow)} .record{fill:#eef5ff;stroke:#88abd5;stroke-width:1.5}</style></defs>
<rect width="1120" height="570" rx="18" fill="#f5f7fa"/>
<text x="36" y="46" font-size="25" font-weight="650">Loom：把事情接着做，并留下依据</text>
<text x="36" y="73" class="sub">模型判断语义；可信宿主核验身份、权限、版本和实际动作。</text>
<g transform="translate(36,116)"><rect class="box" width="168" height="88" rx="12"/><text x="18" y="35" class="title">获准输入</text><text x="18" y="61" class="sub">平台 / 本地 mock</text></g>
<g transform="translate(248,116)"><rect class="box" width="168" height="88" rx="12"/><text x="18" y="35" class="title">身份与任务</text><text x="18" y="61" class="sub">bot / 受众 / 调度</text></g>
<g transform="translate(460,116)"><rect class="box" width="168" height="88" rx="12"/><text x="18" y="35" class="title">模型提供方</text><text x="18" y="61" class="sub">任务 / MockModel</text></g>
<g transform="translate(672,116)"><rect class="box" width="168" height="88" rx="12"/><text x="18" y="35" class="title">受控工具</text><text x="18" y="61" class="sub">范围 / 版本 / 记录</text></g>
<path class="line" d="M204 160H242"/><path class="line" d="M416 160H454"/><path class="line" d="M628 160H666"/>
