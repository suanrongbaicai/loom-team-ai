<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860" role="img" aria-labelledby="title desc">
<title id="title">一条消息怎么走</title>
<desc id="desc">真人用平台身份提出事情，模型起草动作，宿主核对身份、权限、版本和实际动作后写入三层记录，回复要有保存和回执。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3d4d63"/></marker>
<style>
text{font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif;fill:#1c2838}
.title{font-size:28px;font-weight:700}
.box-title{font-size:18px;font-weight:700}
.sub{font-size:14px;fill:#4d5d73}
.label{font-size:13px;fill:#5c6b80}
.card{fill:#fff}
.line{fill:none;stroke:#3d4d63;stroke-width:2;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1080" height="860" fill="#fff"/>
<text x="540" y="42" text-anchor="middle" class="title">一条消息怎么走</text>

<g transform="translate(36,78)">
<rect class="card" width="250" height="96" rx="14" stroke="#c5d0e0" stroke-width="1.5"/>
<text x="125" y="40" text-anchor="middle" class="box-title">真人成员</text>
<text x="125" y="66" text-anchor="middle" class="sub">飞书 / 微信 · 平台身份</text>
</g>
<g transform="translate(400,78)">
<rect class="card" width="270" height="96" rx="14" stroke="#c5d0e0" stroke-width="1.5"/>
<text x="135" y="32" text-anchor="middle" class="box-title">AI 助手（模型）</text>
<text x="135" y="56" text-anchor="middle" class="sub">理解意思，起草动作</text>
<text x="135" y="78" text-anchor="middle" class="sub">不核身份，不生效，不投票</text>
</g>
<g transform="translate(784,70)">
<rect width="260" height="112" rx="14" fill="#fff6f5" stroke="#e15b4c" stroke-width="2"/>
<text x="130" y="36" text-anchor="middle" class="box-title">宿主（程序）</text>
<text x="130" y="62" text-anchor="middle" class="sub">核对身份、权限、版本、实际动作</text>
<text x="130" y="86" text-anchor="middle" class="sub">检查通过才放行</text>
</g>

<path class="line" d="M286 126 H392"/>
<text x="339" y="112" text-anchor="middle" class="label">平台身份即真实身份</text>
<path class="line" d="M670 126 H776"/>
<text x="723" y="112" text-anchor="middle" class="label">提案动作</text>
<path class="line" d="M914 182 V228"/>
<text x="978" y="214" class="label">读写都留痕</text>

<rect x="70" y="236" width="940" height="430" rx="18" fill="#f6f8fb" stroke="#c5d0e0" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="540" y="274" text-anchor="middle" class="box-title">三层记录（按存成什么样分）</text>

<g transform="translate(100,296)">
<rect width="880" height="96" rx="12" fill="#f4f8ff" stroke="#4c84e6" stroke-width="1.6"/>
<text x="28" y="38" class="box-title">Context（认识）</text>
<text x="28" y="68" class="sub">有来源的当前认识。写入要有依据，旧版本留下</text>
</g>
<g transform="translate(100,408)">
<rect width="880" height="96" rx="12" fill="#f3fbf6" stroke="#2f9e6b" stroke-width="1.6"/>
<text x="28" y="38" class="box-title">CL（事项经过）</text>
<text x="28" y="68" class="sub">逐段挂引用：资料、版本、引文。宿主核对原文和权限后才生成链接</text>
</g>
<g transform="translate(100,520)">
<rect width="880" height="96" rx="12" fill="#fffaf0" stroke="#d89a1a" stroke-width="1.6"/>
<text x="28" y="38" class="box-title">Data（原件）</text>
<text x="28" y="68" class="sub">受保护保存的原始字节。链接不等于已经读到原件</text>
</g>

<path class="line" d="M540 666 V708"/>
<g transform="translate(330,716)">
<rect class="card" width="420" height="88" rx="14" stroke="#c5d0e0" stroke-width="1.5"/>
<text x="210" y="36" text-anchor="middle" class="box-title">回复 + 实际回执</text>
<text x="210" y="64" text-anchor="middle" class="sub">说完成了不等于完成了，要有保存记录和回执</text>
</g>
<text x="540" y="836" text-anchor="middle" class="label">模型判断意思。程序核对身份、权限、版本和实际动作。检查通过，不等于理解一定正确。</text>
</svg>
