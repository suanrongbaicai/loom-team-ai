<g transform="translate(894,204)"><rect class="record" width="192" height="72" rx="10"/><text x="16" y="30" class="title">CL</text><text x="16" y="53" class="sub">事项经过与逐次引用</text></g>
<g transform="translate(894,296)"><rect class="record" width="192" height="72" rx="10"/><text x="16" y="30" class="title">Context</text><text x="16" y="53" class="sub">有来源的当前认识</text></g>
<path class="line" d="M840 151H888"/><path class="line" d="M840 160H865V240H888"/><path class="line" d="M840 174H852V332H888"/>
