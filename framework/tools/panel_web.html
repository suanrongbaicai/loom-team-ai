<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作助手</title>
<link rel="icon" href="data:,">
<style>
/* 设计概念：夜间值班台。石墨底带一点青绿，只有一个强调色（月白蓝）；状态色（绿/橙/红）单独使用，不与强调色混用。
   整体离线可用：不引用任何外部字体或脚本，字体走系统中文字体栈；数字等宽对齐。默认窄卡片，窗口变宽才变多列。 */
:root{
  --bg:#0b1013;--surface:#121a1e;--raised:#18232a;--line:#22313a;--line-soft:#1a262d;
  --ink:#e7edeb;--ink2:#b7c4c1;--mute:#7f918e;
  --accent:#7db9d8;--accent-ink:#06151d;--accent-soft:rgba(125,185,216,.13);
  --ok:#5ccb9f;--warn:#f0a85f;--bad:#f07a6e;
  --ok-soft:rgba(92,203,159,.12);--warn-soft:rgba(240,168,95,.12);--bad-soft:rgba(240,122,110,.13);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 28px rgba(0,0,0,.28);
  --font:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  --num:"Bahnschrift","Segoe UI Variable Display","Segoe UI",var(--font);
  --r-lg:16px;--r-md:11px;--r-sm:8px;color-scheme:dark}
:root[data-theme=light]{
  --bg:#e8eeee;--surface:#f6f9f8;--raised:#ffffff;--line:#cfdad9;--line-soft:#dde6e5;
  --ink:#15211f;--ink2:#3d504d;--mute:#667a77;
  --accent:#1f6f98;--accent-ink:#ffffff;--accent-soft:rgba(31,111,152,.11);
  --ok:#17825a;--warn:#a8650f;--bad:#bb372a;
  --ok-soft:rgba(23,130,90,.11);--warn-soft:rgba(168,101,15,.11);--bad-soft:rgba(187,55,42,.1);
  --shadow:0 1px 2px rgba(20,40,38,.06),0 8px 22px rgba(20,40,38,.07);color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);font-variant-numeric:tabular-nums}
svg{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* 顶栏 */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.bar{max-width:1040px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;color:var(--accent)}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.08em}
.grow{flex:1}.stamp{color:var(--mute);font-size:12px}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--raised);color:var(--ink)}
nav{max-width:1040px;margin:0 auto;padding:6px 8px 0;display:flex}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;color:var(--mute);padding:9px 0 10px;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
nav button:hover{color:var(--ink)}nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav button svg{font-size:16px}

main{max-width:1040px;margin:0 auto;padding:16px 16px 28px}
.sec{margin:20px 2px 8px;color:var(--mute);font-size:12px;letter-spacing:.12em}
.sec:first-child{margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* 状态主卡：四段环对应四项后台服务，每段各自亮灭 */
.hero{display:flex;align-items:center;gap:16px;padding:16px}
.hero.bad{background:linear-gradient(0deg,var(--bad-soft),var(--bad-soft)),var(--surface)}
.hero.warn{background:linear-gradient(0deg,var(--warn-soft),var(--warn-soft)),var(--surface)}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;fill:none;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg)}
.ring .seg{stroke:var(--line);transition:stroke .3s}
.ring .seg.ok{stroke:var(--ok)}.ring .seg.off{stroke:var(--bad)}
.ring.first .seg{animation:draw .9s ease-out both}
@keyframes draw{from{stroke-dasharray:0 100}}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:600 22px/1 var(--num)}.ring .c i{font-style:normal;color:var(--mute);font-size:11px;margin-top:4px}
.hero h2{margin:0;font-size:18px;font-weight:650}.hero p{margin:3px 0 0;color:var(--mute);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:var(--r-sm);padding:6px 13px;cursor:pointer;transition:filter .15s,border-color .15s}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}.btn.danger{color:var(--bad)}
.hero .btn{margin-top:10px}

/* 近 24 小时：一块分栏表，不是四个卡片 */
.facts{display:grid;grid-template-columns:1fr 1fr}
.fact{padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.fact:nth-child(odd){border-right:1px solid var(--line-soft)}.fact:nth-last-child(-n+2){border-bottom:0}
.fact b{display:block;font:600 26px/1.15 var(--num)}.fact b small{font-size:12px;font-weight:400;color:var(--mute);margin-left:3px}
.fact span{color:var(--mute);font-size:12.5px}
.fact.attn b{color:var(--warn)}.fact.good b{color:var(--ok)}

.svc{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-soft)}
.svc:last-child{border:0}.svc .n{flex:1}.svc .n small{display:block;color:var(--mute);font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--ok-soft);color:var(--ok)}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.off{background:var(--bad-soft);color:var(--bad)}
.note{padding:12px 16px;color:var(--ink2);font-size:13px}

/* 成员 */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.mem{padding:15px 16px}
.mh{display:flex;align-items:center;gap:11px}
.av{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font:650 16px var(--num);color:var(--ink);background:var(--raised);border:1px solid var(--line)}
.mh .nm{flex:1;min-width:0}.mh .nm b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mh .nm small{color:var(--mute);font-size:12px}
.tag{padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.team{color:var(--ok);border-color:transparent;background:var(--ok-soft)}.tag.basic{color:var(--warn);border-color:transparent;background:var(--warn-soft)}
.field{margin-top:13px}.field>label{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-bottom:6px}
.seg{display:flex;gap:3px;padding:3px;background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:0;background:none;color:var(--ink2);padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}.seg button.on{background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.meta{display:flex;gap:16px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);color:var(--mute);font-size:12.5px;flex-wrap:wrap}
.meta b{color:var(--ink2);font-weight:500}
.acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.dirty{color:var(--warn)}

/* 工具 */
.tool{display:flex;gap:14px;padding:16px;margin-bottom:12px}
.tool .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:19px;flex:none}
.tool h3{margin:0;font-size:15px;font-weight:650}.tool p{margin:3px 0 0;color:var(--mute);font-size:13px}
.tool .btn{margin-top:11px}.tool .msg{margin-top:8px;font-size:13px;color:var(--ink2)}
footer{max-width:1040px;margin:0 auto;padding:0 16px 24px;color:var(--mute);font-size:12px;display:flex;gap:8px;align-items:center}

dialog{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:20px;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.5)}dialog p{margin:0 0 16px;line-height:1.7;white-space:pre-line}dialog .row{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);background:var(--raised);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--shadow);z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hide,[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.5-3.4 3-5 6-5s5.500 1.600 6 5"/><path d="M16 5.200a3 3 0 010 5.600M18 14.200c1.800.6 2.900 2.200 3.200 4.800"/></symbol>
<symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.500 6.500a4 4 0 005 5l-8.600 8.600a2.100 2.100 0 01-3-3L16.500 8.500"/><path d="M14 4.500l5.500 5.500"/></symbol>
<symbol id="i-usb" viewBox="0 0 24 24"><path d="M12 3v13"/><circle cx="12" cy="19" r="2"/><path d="M12 9l-4-2v3M12 12l4-2.500v-2"/></symbol>
<symbol id="i-restart" viewBox="0 0 24 24"><path d="M5 12a7 7 0 112.200 5.100"/><path d="M5 18v-5h5"/></symbol>
<symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/></symbol>
<symbol id="i-mark" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.500"/><path d="M9.500 19.500c2.500-4.500 7-6 13-5.500M12 22.500c2-2.200 5-3.200 9-3"/><circle cx="21.500" cy="11.500" r="1.200" fill="currentColor" stroke="none"/></symbol>
</defs></svg>

<header>
 <div class="bar"><svg class="mark"><use href="#i-mark"/></svg><h1>工作助手</h1><span class="grow"></span><span class="stamp" id="stamp"></span>
  <button class="icon-btn" id="theme" title="切换深色 / 浅色" aria-label="切换深色或浅色"><svg><use href="#i-theme"/></svg></button></div>
 <nav><button data-p="home" class="on"><svg><use href="#i-home"/></svg>概览</button><button data-p="people"><svg><use href="#i-users"/></svg>成员</button><button data-p="tools"><svg><use href="#i-tool"/></svg>工具</button></nav>
</header>

<main>
<section id="home">
 <div class="panel hero" id="hero">
  <div class="ring first" id="ring"><svg viewBox="0 0 100 100" id="ringsvg"></svg><div class="c"><b id="ringn">–</b><i>服务运行</i></div></div>
  <div><h2 id="headline">正在读取…</h2><p id="subline"></p><button class="btn primary hide" id="recover">一键恢复</button></div>
 </div>
 <div class="sec">最近 24 小时</div>
 <div class="panel facts">
  <div class="fact"><b><span id="s_med">–</span><small>秒</small></b><span>回复耗时（中位）</span></div>
  <div class="fact good"><b id="s_done">–</b><span>已完成</span></div>
  <div class="fact" id="f_fail"><b id="s_fail">–</b><span>需要关注</span></div>
  <div class="fact"><b id="s_run">–</b><span>处理中 / 排队</span></div>
 </div>
 <div class="sec">后台服务</div>
 <div class="panel" id="svcs"><div class="note">–</div></div>
 <div class="sec">数据保护</div>
 <div class="panel"><div class="note" id="health">–</div></div>
</section>

<section id="people" class="hide">
 <div class="people" id="rows"></div>
 <p class="stamp" style="margin:12px 2px 0">修改在保存后，从下一个任务起生效，不需要重启。标注“默认”的项使用配置里的值。</p>
</section>

<section id="tools" class="hide">
 <div class="panel tool"><div class="ic"><svg><use href="#i-usb"/></svg></div><div><h3>备份到 U 盘</h3>
  <p>先检查 U 盘是否插好、空间是否够，确认后才开始拷贝。备份不加密，请保管好 U 盘。</p>
  <div class="msg" id="usblive">正在检测 U 盘…</div><button class="btn primary" id="usb">检查 U 盘并备份</button><div class="msg" id="usbmsg"></div></div></div>
 <div class="panel tool"><div class="ic"><svg><use href="#i-restart"/></svg></div><div><h3>重启机器人</h3>
  <p>只重启机器人本体（控制器和网关），不重启电脑。有任务在处理时会拒绝，避免打断。</p>
  <button class="btn" id="restart">重启机器人</button></div></div>
</section>
</main>
<footer>本机运行，不需要联网</footer>
<dialog id="dlg"><p id="dlgt"></p><div class="row"><button class="btn" id="dlgn">取消</button><button class="btn primary" id="dlgy">确定</button></div></dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);let S=null,drafts={},first=true;
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)};
function ask(text){return new Promise(res=>{const d=$('#dlg');$('#dlgt').textContent=text;const done=v=>{d.close();res(v)};$('#dlgy').onclick=()=>done(true);$('#dlgn').onclick=()=>done(false);d.oncancel=()=>res(false);d.showModal()})}
async function api(name,body){const r=await fetch('/api/'+name,{method:'POST',headers:{'X-ANC-Panel':'1','Content-Type':'application/json'},body:JSON.stringify(body||{})});const j=await r.json();if(!j.ok)throw new Error(j.error||'失败');return j.result}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['home','people','tools'].forEach(p=>$('#'+p).classList.toggle('hide',p!==b.dataset.p))});
const SVC={'LOOM-Controller-OwnerWork':['控制器','接收并分派任务'],'LOOM-Gateway-Member':['乙网关','乙的飞书机器人'],'LOOM-Gateway-NewOwner':['负责人网关','负责人的飞书机器人'],'LOOM-ModelProxy':['模型代理','连接模型服务']};
const svcName=n=>SVC[n]||[n.replace('LOOM-','').replace(/-/g,' '),''];
const LV={low:'低',medium:'中',high:'高',xhigh:'极高',minimal:'极低'};
function ring(tasks){const n=tasks.length||4,len=100/n,gap=Math.min(4,len/4);
  $('#ringsvg').innerHTML=Array.from({length:n},(_,i)=>{const t=tasks[i];const c=t?(t.state===4?'ok':'off'):'';
    return `<circle class="seg ${c}" cx="50" cy="50" r="40" pathLength="100" stroke-dasharray="${len-gap} ${100-len+gap}" stroke-dashoffset="${-(i*len)+gap/2}"/>`}).join('')}
function member(m){const d=drafts[m.id]||{},model=d.model||m.model,rs=d.reasoning||m.reasoning;
  const dirty=(d.model&&d.model!==m.model)||(d.reasoning&&d.reasoning!==m.reasoning);
  const label={team:'团队成员',inactive:'已停用'}[m.status];
  const acct=m.account==='own'?'自己的账号':m.account==='shared'?'共用账号':'账号未配置';
  const opts=(list,cur,k,f)=>list.map(x=>`<button data-m="${esc(m.id)}" data-k="${k}" data-v="${esc(x)}" class="${x===cur?'on':''}">${esc(f?f(x):x)}</button>`).join('');
  return `<div class="panel mem"><div class="mh"><div class="av">${esc((m.name||'?').slice(0,1).toUpperCase())}</div>
   <div class="nm"><b>${esc(m.name)}</b><small>${acct}${m.about?' · '+esc(m.about):''}</small></div><span class="tag ${m.status}">${label}</span></div>
   <div class="field"><label>模型<span>${m.model_overridden?'已单独设置':'默认'}</span></label><div class="seg">${opts(S.models,model,'model')}</div></div>
   <div class="field"><label>思考强度</label><div class="seg">${opts(S.levels,rs,'reasoning',x=>LV[x]||x)}</div></div>
   <div class="meta"><span>最近回复 <b>${m.median_reply_seconds==null?'–':m.median_reply_seconds+' 秒'}</b></span><span>24 小时 <b>${m.tasks_24h} 个任务</b></span>${dirty?'<span class="dirty">有未保存的修改</span>':''}</div>
   <div class="acts"><button class="btn primary" data-save="${esc(m.id)}" ${dirty?'':'disabled'}>保存</button>${m.model_overridden?`<button class="btn" data-reset="${esc(m.id)}">还原默认</button>`:''}</div></div>`}
function render(){const s=S;if(!s)return;const sv=s.services,tasks=sv?sv.tasks:[];
 const down=sv?tasks.filter(t=>t.state!==4):[];
 const st=sv?(down.length?'bad':''):'warn';
 $('#hero').className='panel hero '+st;ring(tasks);
 $('#ring').classList.toggle('first',first);setTimeout(()=>{first=false},1000);
 $('#ringn').textContent=sv?(tasks.length-down.length)+'/'+tasks.length:'?';
 $('#headline').textContent=sv?(down.length?'有 '+down.length+' 项服务没有运行':'机器人正常运行'):'暂时读不到服务状态';
 $('#subline').textContent=sv?'内存可用 '+sv.memory_free_gb+' GB':(s.services_error||'');
 $('#recover').classList.toggle('hide',!down.length);
 $('#svcs').innerHTML=sv?tasks.map(t=>{const [n,d]=svcName(t.name),ok=t.state===4;return `<div class="svc"><div class="n">${esc(n)}<small>${esc(d)}</small></div><span class="chip ${ok?'':'off'}">${ok?'运行中':'未运行'}</span></div>`}).join(''):'<div class="note">读不到服务状态</div>';
 const o=s.overview;$('#s_med').textContent=o.median_reply_seconds??'–';$('#s_med').nextElementSibling.hidden=o.median_reply_seconds==null;$('#s_done').textContent=o.done_24h;$('#s_fail').textContent=o.failed_24h;$('#s_run').textContent=o.running_or_waiting;
 $('#f_fail').classList.toggle('attn',o.failed_24h>0);
 const h=s.health;$('#health').textContent=h?(h.problems.length?'需要看：'+h.problems.join('；'):'一切正常 · 上次检查 '+h.checked_at+' · 磁盘剩余 '+Math.round(h.disk_free_mb/1024)+' GB'):'还没有每日检查记录';
 if(!document.activeElement||!document.activeElement.closest('#rows'))$('#rows').innerHTML=s.members.map(member).join('');
 $('#stamp').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
$('#rows').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.k){const id=b.dataset.m;(drafts[id]=drafts[id]||{})[b.dataset.k]=b.dataset.v;$('#rows').innerHTML=S.members.map(member).join('');return}
 try{
  if(b.dataset.save){const id=b.dataset.save,m=S.members.find(x=>x.id===id),d=drafts[id]||{};await api('set_model',{member:id,model:d.model||m.model,reasoning:d.reasoning||m.reasoning});delete drafts[id];toast('已保存，下一个任务起生效')}
  else if(b.dataset.reset){await api('reset_model',{member:b.dataset.reset});delete drafts[b.dataset.reset];toast('已还原为默认')}
  else if(b.dataset.team){if(!await ask('把这位设为团队成员？\n设为后可以使用团队资料。'))return;await api('member',{member:b.dataset.team,action:'make_team_member'});toast('已设为团队成员')}
  else return;
  await load(true)}catch(err){toast(err.message)}});
async function load(force){try{S=await (await fetch('/api/state')).json();if(S.error)throw new Error(S.error);render();if(force)$('#rows').innerHTML=S.members.map(member).join('')}catch(e){$('#headline').textContent='面板读不到数据：'+e.message}}
$('#recover').onclick=async()=>{try{const r=await api('recover');toast('已启动 '+r.started.length+' 项服务');setTimeout(load,3000)}catch(e){toast(e.message)}};
$('#restart').onclick=async()=>{if(!await ask('重启机器人？\n正在处理的任务会让重启被拒绝，不会打断。'))return;try{await api('restart');toast('已重启，稍候刷新');setTimeout(load,6000)}catch(e){toast(e.message)}};
$('#usb').onclick=async()=>{const m=$('#usbmsg');m.textContent='';try{const r=await api('usb_scan');if(!r.drives||!r.drives.length){m.textContent='没有检测到 U 盘，请先插好再点。';return}
 const d=r.drives[0],need=Math.ceil(r.estimate.needed_bytes/1073741824*10)/10,free=Math.floor(d.free/107374182.4)/10;
 if(d.free<r.estimate.needed_bytes){m.textContent='U 盘空间不够：需要约 '+need+' GB，只剩 '+free+' GB。';return}
 if(!await ask('备份到 '+d.letter+'？\n需要约 '+need+' GB，U 盘剩 '+free+' GB。\n备份不加密，请保管好 U 盘。'))return;
 await api('usb_export',{drive:d.letter});m.textContent='已开始备份，请不要拔出 U 盘；完成后会提示。'}catch(e){m.textContent=e.message}};
let usbBusy=false;
async function usbLive(){if(usbBusy||document.hidden||$('#tools').classList.contains('hide'))return;usbBusy=true;const m=$('#usblive');
 try{const r=await api('usb_scan'),gb=b=>(Math.round(b/107374182.4)/10)+' GB',need=r.estimate.needed_bytes;
  if(!r.drives||!r.drives.length){m.textContent='没有检测到 U 盘。插好后这里会自动显示，不用刷新。';return}
  m.innerHTML=r.drives.map(d=>esc(d.letter+' '+(d.label||'U 盘')+' · '+(d.fs||'未知格式')+(d.model?' · '+d.model:'')+' · 剩 '+gb(d.free)+' / 共 '+gb(d.total)+'；备份约需 '+gb(need)+'，'+(d.enough_space?'空间够':'空间不够')+(d.fs_warning?'。'+d.fs_warning:''))).join('<br>')}
 catch(e){m.textContent='U 盘检测暂时失败：'+e.message}finally{usbBusy=false}}
usbLive();setInterval(usbLive,15000);
try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}
$('#theme').onclick=()=>{const r=document.documentElement,l=r.dataset.theme!=='light';r.dataset.theme=l?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}};
load();setInterval(load,5000);
</script>
</body></html>
